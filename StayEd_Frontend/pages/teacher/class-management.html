<!doctype html>
<html lang="en">
  <head>
    <script data-stayed-font-scale-bootstrap>
      (function () {
        try {
          var v = localStorage.getItem("stayed_font_scale");
          if (v) document.documentElement.setAttribute("data-font-scale", v);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayEd | Class Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Franklin:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/img/brand/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      href="../../assets/img/brand/apple-touch-icon.png"
    />
  </head>
  <body class="st-app" data-page="Class Management">
    <div data-component="layout/sidebar"></div>

    <div class="st-main">
      <div data-component="layout/navbar"></div>

      <main class="st-content">
        <div class="st-page-header">
          <div>
            <h1 class="st-page-header-title">Class Management</h1>
            <p class="st-page-header-subtitle">
              Your assigned classes. Open a class to manage attendance, module
              progress, and enroll learners into it.
            </p>
          </div>
          <div class="st-page-header-actions">
            <button
              type="button"
              class="st-btn st-btn-primary"
              data-add-class-btn
            >
              <span class="material-symbols-outlined">add</span>
              Add Class
            </button>
          </div>
        </div>

        <!-- CLC context banner: shows which CLC these classes belong to.
             Populated from ?clc= in the URL (arriving from CLC Overview),
             falling back to the teacher's current CLC assignment. -->
        <div class="st-class-context-banner" data-clc-context-banner>
          <span class="material-symbols-outlined st-class-context-banner-icon"
            >hub</span
          >
          <div class="st-class-context-banner-text">
            <span class="st-class-context-banner-name" data-clc-context-name
              >—</span
            >
            <span class="st-class-context-banner-meta" data-clc-context-meta
              >Community Learning Center</span
            >
          </div>
          <a href="clc-overview.html" class="st-class-context-banner-switch">
            Switch CLC
            <span class="material-symbols-outlined">swap_horiz</span>
          </a>
        </div>

        <div class="st-clc-grid" data-class-grid>
          <div class="st-empty col-12" style="grid-column: 1/-1">
            <span class="material-symbols-outlined">hourglass_empty</span>
            <p class="st-empty-title">Loading your classes…</p>
          </div>
        </div>
      </main>

      <div data-component="layout/footer"></div>
    </div>

    <div data-component="layout/toast"></div>
    <div data-component="layout/modal"></div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/core/utils.js"></script>
    <script src="../../assets/js/core/router.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/core/guards.js"></script>
    <script src="../../assets/js/core/layout.js"></script>
    <script src="../../assets/js/core/skeletons.js"></script>
    <script src="../../assets/js/core/app.js"></script>
    <script src="../../assets/js/components/component-loader.js"></script>
    <script src="../../assets/js/components/toast.js"></script>
    <script src="../../assets/js/components/modal.js"></script>
    <script src="../../assets/js/teacher/class-attendance-modal.js"></script>
    <script src="../../assets/js/teacher/class-management.js"></script>
  </body>
</html>
