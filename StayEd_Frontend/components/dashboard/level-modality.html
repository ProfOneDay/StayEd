<div class="st-panel st-panel-pad col-6" data-animate>
  <div class="st-panel-head">
    <div>
      <h3 class="st-panel-title">Learning Level</h3>
      <p class="st-panel-subtitle">
        How filtered learners are spread across ALS levels.
      </p>
    </div>
    <div class="chart-type-toggle" role="group" aria-label="Choose chart type" id="levelChartToggle">
      <button type="button" class="chart-type-btn is-active" data-chart-type="bar">Bar</button>
      <button type="button" class="chart-type-btn" data-chart-type="pie">Donut</button>
    </div>
  </div>
  <div class="chart-canvas-wrap">
    <canvas id="levelChartCanvas" height="220"></canvas>
    <p class="chart-canvas-note" id="levelChartNote"></p>
  </div>
</div>

<div class="st-panel st-panel-pad col-6" data-animate>
  <div class="st-panel-head">
    <div>
      <h3 class="st-panel-title">Modality</h3>
      <p class="st-panel-subtitle">
        How filtered learners are split by delivery mode.
      </p>
    </div>
    <div class="chart-type-toggle" role="group" aria-label="Choose chart type" id="modalityChartToggle">
      <button type="button" class="chart-type-btn is-active" data-chart-type="pie">Donut</button>
      <button type="button" class="chart-type-btn" data-chart-type="bar">Bar</button>
    </div>
  </div>
  <div class="chart-canvas-wrap">
    <canvas id="modalityChartCanvas" height="220"></canvas>
    <p class="chart-canvas-note" id="modalityChartNote"></p>
  </div>
</div>
