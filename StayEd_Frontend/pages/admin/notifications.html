<!doctype html>
<html lang="en">
<head>
  <script data-stayed-font-scale-bootstrap>
    (function () {
      try {
        var v = localStorage.getItem("stayed_font_scale");
        if (v) document.documentElement.setAttribute("data-font-scale", v);
      } catch (e) {}
    })();
  </script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Franklin:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/main.css" />
<title>StayEd Admin — Notifications</title>
</head>
<body class="st-app" data-page="Notifications">
<div data-component="layout/sidebar-admin"></div>
<div class="st-main">
<div data-component="layout/navbar"></div>
<main class="st-content">
  <div class="st-page-header">
    <div>
      <h1 class="st-page-header-title">Notifications</h1>
      <p class="st-page-header-subtitle">
        Alerts and updates across the division.
      </p>
    </div>
  </div>

  <div class="st-notif-toolbar">
    <div class="st-notif-tabs" data-notif-tabs>
      <button type="button" class="st-notif-tab is-active" data-notif-filter="all">
        All <span class="count" data-notif-count-all>0</span>
      </button>
      <button type="button" class="st-notif-tab" data-notif-filter="unread">
        Unread <span class="count" data-notif-count-unread>0</span>
      </button>
    </div>

    <div class="st-notif-actions">
      <button type="button" class="st-btn st-btn-outline st-btn-xs" data-notif-mark-all>
        <span class="material-symbols-outlined">done_all</span>
        Mark All Read
      </button>
    </div>
  </div>

  <div class="st-notif-list" data-notif-list>
    <div class="st-empty">
      <span class="material-symbols-outlined">hourglass_empty</span>
      <p class="st-empty-title">Loading notifications…</p>
    </div>
  </div>
</main>
</div>

<div data-component="layout/toast"></div>
<div data-component="layout/modal"></div>

<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/core/utils.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/auth.js"></script>
<script src="../../assets/js/core/guards.js"></script>
<script src="../../assets/js/core/router.js"></script>
<script src="../../assets/js/core/layout.js"></script>
<script src="../../assets/js/components/component-loader.js"></script>
<script src="../../assets/js/components/toast.js"></script>
<script src="../../assets/js/components/modal.js"></script>
<script src="../../assets/js/admin/notifications.js"></script>
</body>
</html>
