<div
    id="st-modal"
    class="st-modal hidden">

    <div class="st-modal-backdrop"></div>

    <div class="st-modal-card">

        <div class="st-modal-header">

            <h2
                id="st-modal-title">

                Confirmation

            </h2>

            <button
                type="button"
                id="st-modal-close"
                class="st-modal-close"
                aria-label="Close">

                <span class="material-symbols-outlined">close</span>

            </button>

        </div>

        <div
            id="st-modal-body"
            class="st-modal-body">

        </div>

        <div class="st-modal-footer">

            <button

                id="st-modal-cancel"

                class="st-btn st-btn-secondary">

                Cancel

            </button>

            <button

                id="st-modal-confirm"

                class="st-btn st-btn-primary">

                Confirm

            </button>

        </div>

    </div>

</div>
