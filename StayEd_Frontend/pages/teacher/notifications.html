<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayEd | Notifications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Franklin:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/img/brand/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      href="../../assets/img/brand/apple-touch-icon.png"
    />
  </head>
  <body class="st-app" data-page="Notifications">
    <div data-component="layout/sidebar"></div>

    <div class="st-main">
      <div data-component="layout/navbar"></div>

      <main class="st-content">
        <div class="st-page-header">
          <div>
            <h1 class="st-page-header-title">Notifications</h1>
            <p class="st-page-header-subtitle">
              Stay up to date on alerts, interventions, and system updates.
            </p>
          </div>
        </div>

        <div class="st-notif-toolbar">
          <div class="st-notif-tabs" data-notif-tabs>
            <button
              type="button"
              class="st-notif-tab is-active"
              data-notif-filter="all"
            >
              All <span class="count" data-notif-count-all>0</span>
            </button>
            <button
              type="button"
              class="st-notif-tab"
              data-notif-filter="unread"
            >
              Unread <span class="count" data-notif-count-unread>0</span>
            </button>
            <button
              type="button"
              class="st-notif-tab"
              data-notif-filter="alert"
            >
              Alerts
            </button>
            <button
              type="button"
              class="st-notif-tab"
              data-notif-filter="intervention"
            >
              Interventions
            </button>
            <button
              type="button"
              class="st-notif-tab"
              data-notif-filter="registration"
            >
              Registrations
            </button>
            <button
              type="button"
              class="st-notif-tab"
              data-notif-filter="system"
            >
              System
            </button>
          </div>

          <div class="st-notif-actions">
            <button
              type="button"
              class="st-btn st-btn-outline st-btn-xs"
              data-notif-mark-all
            >
              <span class="material-symbols-outlined">done_all</span>
              Mark All Read
            </button>
          </div>
        </div>

        <div class="st-notif-list" data-notif-list>
          <div class="st-empty">
            <span class="material-symbols-outlined">hourglass_empty</span>
            <p class="st-empty-title">Loading notifications…</p>
          </div>
        </div>
      </main>

      <div data-component="layout/footer"></div>
    </div>

    <div data-component="layout/toast"></div>
    <div data-component="layout/modal"></div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/mock/mock-db.js"></script>
    <script src="../../assets/js/mock/mock-notifications.js"></script>
    <script src="../../assets/js/mock/mock-api.js"></script>
    <script src="../../assets/js/core/utils.js"></script>
    <script src="../../assets/js/core/router.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/core/guards.js"></script>
    <script src="../../assets/js/core/layout.js"></script>
    <script src="../../assets/js/core/skeletons.js"></script>
    <script src="../../assets/js/core/app.js"></script>
    <script src="../../assets/js/components/component-loader.js"></script>
    <script src="../../assets/js/components/toast.js"></script>
    <script src="../../assets/js/components/modal.js"></script>
    <script src="../../assets/js/teacher/notifications.js"></script>
  </body>
</html>
