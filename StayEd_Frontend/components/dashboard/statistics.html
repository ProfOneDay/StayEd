<div class="st-panel st-panel-pad col-8" aria-label="Learner overview" data-animate>
  <div class="st-overview">
    <div class="st-overview-total">
      <div class="value num" data-stat-total data-countup>0</div>
      <div class="label">registered learners</div>
    </div>
    <div>
      <div class="st-risk-strip" data-risk-strip role="img" aria-label="Risk distribution">
        <span class="high" data-risk-strip-high></span>
        <span class="mod" data-risk-strip-moderate></span>
        <span class="low" data-risk-strip-low></span>
      </div>
      <div class="st-risk-legend">
        <div class="st-risk-legend-item high">
          <span class="count num" data-stat-high data-countup>0</span>
          <span class="name">High risk</span>
          <span class="pct num" data-stat-high-pct>0%<span class="pct-suffix"> of learners</span></span>
        </div>
        <div class="st-risk-legend-item mod">
          <span class="count num" data-stat-moderate data-countup>0</span>
          <span class="name">Moderate risk</span>
          <span class="pct num" data-stat-moderate-pct>0%<span class="pct-suffix"> of learners</span></span>
        </div>
        <div class="st-risk-legend-item low">
          <span class="count num" data-stat-low data-countup>0</span>
          <span class="name">Low risk</span>
          <span class="pct num" data-stat-low-pct>0%<span class="pct-suffix"> of learners</span></span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="st-panel st-panel-pad col-4 st-followup-card" aria-label="Interventions to update" data-animate>
  <div class="head">
    <span class="material-symbols-outlined">assignment_late</span>
    Interventions to update
  </div>
  <ul data-stat-intervention-detail></ul>
  <p class="hint">Update these in each learner's profile.</p>
</div>
