<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayEd | Manage Modules</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Franklin:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/img/brand/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      href="../../assets/img/brand/apple-touch-icon.png"
    />
  </head>
  <body class="st-app" data-page="Manage Modules">
    <div data-component="layout/sidebar"></div>

    <div class="st-main">
      <div data-component="layout/navbar"></div>

      <main class="st-content">
        <div class="st-page-header">
          <div>
            <h1 class="st-page-header-title">Manage Modules</h1>
            <p class="st-page-header-subtitle">
              Set up this class's modules once, then track who has received
              and returned each one.
            </p>
          </div>
          <div class="st-page-header-actions">
            <button
              type="button"
              class="st-btn st-btn-primary"
              data-add-module-btn
            >
              <span class="material-symbols-outlined">add</span>
              Add Module
            </button>
          </div>
        </div>

        <!-- Class context banner: same component/markup as Learner Records
             (see learner-records-hub.css .st-class-context-banner*), so
             module management shows the same CLC/class identity. -->
        <div
          class="st-class-context-banner st-hidden"
          data-class-context-banner
        >
          <span class="material-symbols-outlined st-class-context-banner-icon"
            >school</span
          >
          <div class="st-class-context-banner-text">
            <span class="st-class-context-banner-clc" data-class-context-clc
              >—</span
            >
            <span
              class="st-class-context-banner-level"
              data-class-context-level
              >—</span
            >
            <span class="st-class-context-banner-meta" data-class-context-meta
              >—</span
            >
          </div>
          <a
            href="class-management.html"
            class="st-class-context-banner-switch"
          >
            Switch Class
            <span class="material-symbols-outlined">swap_horiz</span>
          </a>
        </div>

        <div class="st-panel st-panel-pad" data-no-class-notice style="display:none">
          <p class="st-panel-subtitle">
            Open Module Management from a specific class in Learner Records
            to manage its modules.
          </p>
        </div>

        <div data-view-root></div>
      </main>

      <div data-component="layout/footer"></div>
    </div>

    <div data-component="layout/toast"></div>
    <div data-component="layout/modal"></div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/core/utils.js"></script>
    <script src="../../assets/js/core/router.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/core/guards.js"></script>
    <script src="../../assets/js/core/layout.js"></script>
    <script src="../../assets/js/core/skeletons.js"></script>
    <script src="../../assets/js/core/app.js"></script>
    <script src="../../assets/js/components/component-loader.js"></script>
    <script src="../../assets/js/components/toast.js"></script>
    <script src="../../assets/js/components/modal.js"></script>
    <script src="../../assets/js/teacher/module-management.js"></script>
  </body>
</html>
