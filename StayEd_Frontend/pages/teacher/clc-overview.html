<!doctype html>
<html lang="en">
  <head>
    <script data-stayed-font-scale-bootstrap>
      (function () {
        try {
          var v = localStorage.getItem("stayed_font_scale");
          if (v) document.documentElement.setAttribute("data-font-scale", v);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayEd | CLC Overview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Franklin:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/img/brand/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      href="../../assets/img/brand/apple-touch-icon.png"
    />
  </head>
  <body class="st-app" data-page="CLC Overview">
    <div data-component="layout/sidebar"></div>

    <div class="st-main">
      <div data-component="layout/navbar"></div>

      <main class="st-content">
        <div class="st-page-header">
          <div>
            <h1 class="st-page-header-title">
              Community Learning Center Overview
            </h1>
            <p class="st-page-header-subtitle">
              Manage and monitor your assigned Community Learning Centers.
            </p>
          </div>
        </div>

        <!-- Summary strip: CLC count, total learners, and the teacher's
             assigned municipality (read-only — teachers are scoped to one
             municipality at account setup; the Municipality filter itself
             lives only in the Admin/ALS Division Supervisor module). -->
        <section class="st-panel st-clc-summary" aria-label="Summary" data-animate>
          <div class="st-clc-summary-item">
            <span class="st-clc-summary-icon"><span class="material-symbols-outlined">hub</span></span>
            <div>
              <p class="st-clc-summary-value num" data-clc-count data-countup>0</p>
              <p class="st-clc-summary-label"><span class="st-lbl-long">Community Learning Centers</span><span class="st-lbl-short">CLCs</span></p>
            </div>
          </div>
          <div class="st-clc-summary-item">
            <span class="st-clc-summary-icon"><span class="material-symbols-outlined">groups</span></span>
            <div>
              <p class="st-clc-summary-value num" data-clc-learners data-countup>0</p>
              <p class="st-clc-summary-label">Total learners</p>
            </div>
          </div>
          <div class="st-clc-summary-item st-clc-municipality-label">
            <span class="st-clc-summary-icon"><span class="material-symbols-outlined">location_on</span></span>
            <div>
              <p class="st-clc-summary-value st-clc-summary-value--text" data-clc-municipality-name>—</p>
              <p class="st-clc-summary-label">Your municipality</p>
            </div>
          </div>
        </section>

        <!-- Search bar -->
        <div class="st-filter-bar">
          <div class="st-filter-row st-clc-filter-row">
            <label class="st-search st-clc-search-wide">
              <span class="material-symbols-outlined">search</span>
              <input
                type="text"
                placeholder="Search CLC name"
                data-clc-search
                aria-label="Search CLC name"
              />
            </label>

            <div class="st-clc-showing-indicator">
              <span data-clc-showing>Showing 0 Community Learning Centers</span>
            </div>
          </div>
        </div>

        <!-- CLC Grid -->
        <div class="st-clc-grid" data-clc-grid data-animate-cards>
          <div class="st-empty col-12">
            <span class="material-symbols-outlined">hourglass_empty</span>
            <p class="st-empty-title">Loading Community Learning Centers…</p>
          </div>
        </div>
      </main>

      <div data-component="layout/footer"></div>
    </div>

    <div data-component="layout/toast"></div>
    <div data-component="layout/modal"></div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/core/utils.js"></script>
    <script src="../../assets/js/core/router.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/core/guards.js"></script>
    <script src="../../assets/js/core/layout.js"></script>
    <script src="../../assets/js/core/skeletons.js"></script>
    <script src="../../assets/js/core/app.js"></script>
    <script src="../../assets/js/components/component-loader.js"></script>
    <script src="../../assets/js/components/toast.js"></script>
    <script src="../../assets/js/components/modal.js"></script>
    <script src="../../assets/js/teacher/clc-overview.js"></script>
  </body>
</html>
