# StayEd: nginx serves the static frontend and forwards /api to gunicorn.
# setup_server.sh replaces __DOMAIN__ with your domain.
# certbot --nginx later adds the HTTPS (port 443) block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /opt/stayed/StayEd_Frontend;
    index index.html;

    # Uploads are capped at 5 MB in Flask; give nginx a little headroom.
    client_max_body_size 6M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /pages/errors/404.html;

    # Never serve hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
