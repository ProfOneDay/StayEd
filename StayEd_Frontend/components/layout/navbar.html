<header class="st-navbar">
  <div class="st-navbar-left">
    <button
      type="button"
      id="sidebarToggle"
      class="st-icon-button st-navbar-toggle"
      aria-label="Toggle menu"
    >
      <span class="material-symbols-outlined">menu</span>
    </button>

    <nav class="st-breadcrumb" data-st-breadcrumb>
      <span>Dashboard</span>
      <span class="material-symbols-outlined st-breadcrumb-icon"
        >chevron_right</span
      >
      <span class="active">Teacher Dashboard</span>
    </nav>
  </div>

  <div class="st-navbar-right">
    <button
      type="button"
      class="st-icon-button"
      data-st-notifications
      aria-label="Notifications"
    >
      <span class="material-symbols-outlined">notifications</span>
      <span
        class="st-notification-dot st-hidden"
        data-st-notification-dot
      ></span>
    </button>

    <button
      type="button"
      class="st-icon-button"
      data-st-settings
      aria-label="Settings"
    >
      <span class="material-symbols-outlined">settings</span>
    </button>

    <div class="st-navbar-divider"></div>

    <div class="st-user" data-st-user-menu>
      <div class="st-user-details">
        <p class="st-user-name" data-st-user-name>Teacher</p>
        <p class="st-user-role" data-st-user-role>ALS Teacher</p>
      </div>

      <div class="st-user-avatar-wrap" data-st-user-avatar-fallback>
        <img class="st-user-avatar" data-st-user-avatar alt="Profile photo" hidden />
        <span class="st-avatar-initials" data-st-user-initials>T</span>
      </div>
    </div>
  </div>
</header>
