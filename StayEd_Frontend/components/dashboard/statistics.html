<div class="st-stat-card st-stat-card--primary col-3">
  <div class="st-stat-card-head">
    <span class="st-stat-card-label">Registered Learners</span>
    <span class="material-symbols-outlined st-stat-card-icon">groups</span>
  </div>
  <div class="st-stat-card-body">
    <p class="st-stat-card-value" data-stat-total>--</p>
    <p class="st-stat-card-meta" data-stat-total-meta>Loading class context…</p>
  </div>
</div>

<div class="st-stat-card st-stat-card--high col-3">
  <div class="st-stat-card-head">
    <span class="st-stat-card-label">High Risk Learners</span>
    <span class="material-symbols-outlined st-stat-card-icon">warning</span>
  </div>
  <div class="st-stat-card-body">
    <p class="st-stat-card-value" data-stat-high>--</p>
    <p class="st-stat-card-meta" data-stat-high-meta>&nbsp;</p>
  </div>
</div>

<div class="st-stat-card st-stat-card--moderate col-3">
  <div class="st-stat-card-head">
    <span class="st-stat-card-label">Moderate Risk Learners</span>
    <span class="material-symbols-outlined st-stat-card-icon"
      >notification_important</span
    >
  </div>
  <div class="st-stat-card-body">
    <p class="st-stat-card-value" data-stat-moderate>--</p>
    <p class="st-stat-card-meta" data-stat-moderate-meta>Stable</p>
  </div>
</div>

<div class="st-stat-card st-stat-card--low col-3">
  <div class="st-stat-card-head">
    <span class="st-stat-card-label">Low Risk Learners</span>
    <span class="material-symbols-outlined st-stat-card-icon"
      >verified_user</span
    >
  </div>
  <div class="st-stat-card-body">
    <p class="st-stat-card-value" data-stat-low>--</p>
    <p class="st-stat-card-meta" data-stat-low-meta>Stable</p>
  </div>
</div>
