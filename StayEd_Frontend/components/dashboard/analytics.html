<div class="st-panel st-panel-pad col-8" data-animate>
  <div class="st-panel-head">
    <div>
      <h3 class="st-panel-title">Risk Distribution</h3>
      <p class="st-panel-subtitle">
        Learners by their latest prediction result.
      </p>
    </div>
    <div class="st-head-actions">
      <div class="chart-type-toggle" role="group" aria-label="Choose chart type" id="riskChartToggle">
        <button type="button" class="chart-type-btn is-active" data-chart-type="bar">Bar</button>
        <button type="button" class="chart-type-btn" data-chart-type="pie">Donut</button>
        <button type="button" class="chart-type-btn" data-chart-type="line">Trend</button>
      </div>
      <a class="st-panel-link" href="early-warning.html">
        View details
        <span class="material-symbols-outlined">chevron_right</span>
      </a>
    </div>
  </div>

  <div id="riskChartView" class="chart-canvas-wrap" hidden>
    <canvas id="riskChartCanvas" height="220"></canvas>
    <p class="chart-canvas-note" id="riskChartNote"></p>
  </div>

  <div class="st-riskchart" id="riskBarView">
    <div class="st-hbars">
      <div class="st-hbar-row">
        <span class="st-hbar-label">High</span>
        <div class="st-hbar-track"><div class="st-hbar st-hbar--high" data-bar="high"></div></div>
        <span class="st-hbar-value num" data-bar-value="high">0<small data-bar-pct="high">0%</small></span>
      </div>
      <div class="st-hbar-row">
        <span class="st-hbar-label">Moderate</span>
        <div class="st-hbar-track"><div class="st-hbar st-hbar--moderate" data-bar="moderate"></div></div>
        <span class="st-hbar-value num" data-bar-value="moderate">0<small data-bar-pct="moderate">0%</small></span>
      </div>
      <div class="st-hbar-row">
        <span class="st-hbar-label">Low</span>
        <div class="st-hbar-track"><div class="st-hbar st-hbar--low" data-bar="low"></div></div>
        <span class="st-hbar-value num" data-bar-value="low">0<small data-bar-pct="low">0%</small></span>
      </div>
      <div class="st-hbar-scale" aria-hidden="true">
        <span></span>
        <div data-riskchart-yaxis></div>
        <span></span>
      </div>
    </div>

    <div class="st-riskchart-side">
      <div class="st-insights">
        <h4 class="st-insights-title">Risk insights</h4>
        <ul data-risk-insights>
          <li><span class="st-bullet"></span>Most learners are currently classified as Low Risk.</li>
          <li><span class="st-bullet st-bullet--error"></span>Three learners recently moved from Moderate to High Risk.</li>
        </ul>
      </div>

      <div class="st-meta-grid">
        <div class="st-meta-grid-item"><p>Coverage</p><p data-risk-coverage>--</p></div>
        <div class="st-meta-grid-item"><p>Model</p><p data-risk-model>--</p></div>
        <div class="st-meta-grid-item"><p>Confidence</p><p class="is-teal" data-risk-confidence>--</p></div>
      </div>
    </div>
  </div>
</div>
