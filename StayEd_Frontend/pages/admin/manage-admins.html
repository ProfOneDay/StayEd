<head>
  <script data-stayed-font-scale-bootstrap>
    (function () {
      try {
        var v = localStorage.getItem("stayed_font_scale");
        if (v) document.documentElement.setAttribute("data-font-scale", v);
      } catch (e) {}
    })();
  </script>

<body class="st-app st-admin" data-page="Manage Admins">
<div data-component="layout/sidebar-admin"></div>
<div class="st-main">
<div data-component="layout/navbar"></div>
<main class="st-content">
  <div class="st-page-header">
    <div>
      <h1 class="st-page-header-title">Manage Admins</h1>
      <p class="st-page-header-subtitle">Assign what each admin can manage, and who else can be a super admin. Super admin only.</p>
    </div>
  </div>

  <section class="st-panel st-table-card">
    <div class="st-table-card-head">
      <h2 class="st-table-card-title">Admin accounts</h2>
      <span class="st-table-card-count" id="adminCount">0 admins</span>
    </div>
    <div class="st-table-scroll">
      <table class="st-data-table" id="adminsTable">
        <thead>
          <tr>
            <th>Admin</th>
            <th>Title</th>
            <th>Can manage CLCs</th>
            <th>Can manage users</th>
            <th>Super admin</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="adminsTbody"></tbody>
      </table>
    </div>
  </section>
