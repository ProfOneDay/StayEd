<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>StayEd | My Progress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Franklin:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"

    <link rel="stylesheet" href="../../assets/css/variables.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />

  <body class="st-sv-body">
    <div class="st-sv">
      <header class="st-sv-topbar">
        <a class="st-sv-brand" href="#">
          <img src="../../assets/img/brand/logo-dark.png" alt="" />
          <h1>StayEd</h1>
        </a>
        <div class="st-sv-topbar-right">
          <span class="st-sv-chip">
            <span class="material-symbols-outlined">visibility</span>
            <span>Student view &middot; read-only</span>
          </span>
          <a class="st-sv-exit" href="access.html">

          </a>
        </div>
      </header>

      <main class="st-sv-main st-student-body" data-student-body>
        <p class="st-sv-loading" data-student-loading>Loading your progress&hellip;</p>
      </main>

      <footer class="st-sv-foot">
        <span>&copy; 2026 Department of Education - Alternative Learning System</span>
        <span>Shared with you by your ALS teacher</span>
