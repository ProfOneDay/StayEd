<!doctype html>
<html lang="en">
  <head>
    <script data-stayed-font-scale-bootstrap>
      (function () {
        try {
          var v = localStorage.getItem("stayed_font_scale");
          if (v) document.documentElement.setAttribute("data-font-scale", v);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayEd | Early Warning Alerts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Franklin:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/img/brand/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      href="../../assets/img/brand/apple-touch-icon.png"
    />
  </head>
  <body class="st-app" data-page="Early Warning Alerts">
    <div data-component="layout/sidebar"></div>

    <div class="st-main">
      <div data-component="layout/navbar"></div>

      <main class="st-content">
        <div class="st-page-header">
          <div>
            <h1 class="st-page-header-title">Early Warning Alerts</h1>
            <p class="st-page-header-subtitle">
              Monitor learners requiring immediate intervention to prevent
              potential dropout.
            </p>
          </div>
        </div>

        <section class="st-panel st-panel-pad st-overview" data-animate aria-label="Alert summary">
          <div class="st-overview-total">
            <div class="value num" data-ewa-total data-countup>0</div>
            <div class="label">active alerts</div>
          </div>
          <div>
            <div class="st-risk-strip" data-risk-strip role="img" aria-label="High, moderate and low risk alerts">
              <span class="high" data-risk-strip-high></span>
              <span class="mod" data-risk-strip-moderate></span>
              <span class="low" data-risk-strip-low></span>
            </div>
            <div class="st-risk-legend st-risk-legend--3">
              <div class="st-risk-legend-item high">
                <span class="count num" data-ewa-high data-countup>0</span>
                <span class="name">High risk</span>
              </div>
              <div class="st-risk-legend-item mod">
                <span class="count num" data-ewa-moderate data-countup>0</span>
                <span class="name">Moderate risk</span>
              </div>
              <div class="st-risk-legend-item low">
                <span class="count num" data-ewa-low data-countup>0</span>
                <span class="name">Low risk</span>
              </div>
            </div>
          </div>
        </section>

        <section class="st-panel st-table-card">
          <div class="st-table-card-head">
            <h2 class="st-table-card-title">Learners requiring attention</h2>
            <span class="st-table-card-count" data-ewa-count>0 alerts</span>
          </div>

          <div class="st-toolbar st-ewa-filter-bar">
            <label class="st-search">
              <span class="material-symbols-outlined">search</span>
              <input
                type="text"
                placeholder="Search by name or LRN"
                data-ewa-search
                aria-label="Search alerts"
              />
            </label>

            <select class="st-select" data-ewa-filter-risk aria-label="Filter by risk level">
              <option value="">All risk levels</option>
              <option value="High">High Risk</option>
              <option value="Moderate">Medium Risk</option>
              <option value="Low">Low Risk</option>
            </select>

            <select class="st-select" data-ewa-filter-clc aria-label="Filter by CLC">
              <option value="">All CLCs</option>
            </select>

            <button type="button" class="st-text-btn st-ewa-clear-btn" data-ewa-clear>
              <span class="material-symbols-outlined">filter_list_off</span>
              Clear filters
            </button>
          </div>

          <div class="st-table-scroll">
            <table class="st-data-table st-ewa-table">
              <thead>
                <tr>
                  <th>Learner</th>
                  <th>Level</th>
                  <th>CLC</th>
                  <th>Risk
                    <span
                      class="material-symbols-outlined st-th-info"
                      tabindex="0"
                      role="img"
                      aria-label="Predicted likelihood of dropping out, based on the learner's latest risk assessment."
                      data-tip="Predicted likelihood of dropping out, based on the learner's latest risk assessment."
                      >info</span
                    >
                  </th>
                  <th>Date generated</th>
                </tr>
              </thead>
              <tbody data-ewa-body data-animate-rows>
                <tr>
                  <td colspan="5" class="st-table-empty-cell">
                    Loading alerts…
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="st-pagination">
            <span class="st-pagination-info" data-ewa-info
              >Showing 0 alerts</span
            >
            <div class="st-pagination-controls" data-ewa-pages></div>
          </div>
        </section>
      </main>

      <div data-component="layout/footer"></div>
    </div>

    <div data-component="layout/toast"></div>
    <div data-component="layout/modal"></div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/core/utils.js"></script>
    <script src="../../assets/js/core/router.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/core/guards.js"></script>
    <script src="../../assets/js/core/layout.js"></script>
    <script src="../../assets/js/core/skeletons.js"></script>
    <script src="../../assets/js/core/app.js"></script>
    <script src="../../assets/js/components/component-loader.js"></script>
    <script src="../../assets/js/components/toast.js"></script>
    <script src="../../assets/js/components/modal.js"></script>
    <script src="../../assets/js/teacher/early-warning.js"></script>
  </body>
</html>
