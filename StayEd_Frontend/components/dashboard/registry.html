<div class="st-panel col-12">
  <div class="st-registry-head">
    <div>
      <h3 class="st-panel-title">Student Registry Summary</h3>
      <p class="st-panel-subtitle">
        Learners in the currently selected class.
      </p>
    </div>

    <div class="st-registry-tools">
      <div class="st-search">
        <span class="material-symbols-outlined">search</span>
        <input
          type="text"
          placeholder="Search by name or LRN"
          data-registry-search
          aria-label="Search learner by name or LRN"
        />
      </div>

      <a class="st-btn st-btn-outline st-btn-xs" href="student-registry.html">
        View full registry
      </a>
    </div>
  </div>

  <div class="st-table-scroll">
    <table class="st-data-table">
      <thead>
        <tr>
          <th class="has-sort">
            <button type="button" class="st-sort-btn" data-registry-sort-key="name">
              Learner
              <span class="material-symbols-outlined st-sort-icon">unfold_more</span>
            </button>
            <span class="st-th-sep">/</span>
            <button type="button" class="st-sort-btn" data-registry-sort-key="lrn">
              LRN
              <span class="material-symbols-outlined st-sort-icon">unfold_more</span>
            </button>
          </th>
          <th>Learning level</th>
          <th>Modality</th>
          <th class="has-sort">
            <button type="button" class="st-sort-btn" data-registry-sort-key="risk">
              Risk level
              <span class="material-symbols-outlined st-sort-icon">unfold_more</span>
            </button>
          </th>
          <th>Latest activity</th>
          <th class="is-right">Actions</th>
        </tr>
      </thead>
      <tbody data-registry-body data-animate-rows>
        <tr>
          <td colspan="6" class="st-registry-loading">Loading learners…</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="st-pagination" data-registry-pagination>
    <span class="st-pagination-info" data-registry-info
      >Showing 0 learners</span
    >
    <div class="st-pagination-controls" data-registry-pages></div>
  </div>
</div>
