<!doctype html>
<html lang="en">
  <head>
    <script data-stayed-font-scale-bootstrap>
      (function () {
        try {
          var v = localStorage.getItem("stayed_font_scale");
          if (v) document.documentElement.setAttribute("data-font-scale", v);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayEd | Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Franklin:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/img/brand/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      href="../../assets/img/brand/apple-touch-icon.png"
    />
  </head>
  <body class="st-error-page">
    <main class="st-error-shell">
      <div class="st-error-icon st-error-icon--info">
        <span class="material-symbols-outlined">search_off</span>
      </div>
      <p class="st-error-code">404</p>
      <h1 class="st-error-title">Page Not Found</h1>
      <p class="st-error-text">
        The page you're looking for doesn't exist or may have been moved. Check
        the URL or head back to your dashboard.
      </p>
      <div class="st-error-actions">
        <a href="../teacher/dashboard.html" class="st-btn st-btn-primary">
          <span class="material-symbols-outlined">home</span>
          Back to Dashboard
        </a>
        <a href="../auth/login.html" class="st-btn st-btn-outline"
          >Return to Login</a
        >
      </div>
    </main>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/core/utils.js"></script>
    <script src="../../assets/js/core/router.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
  </body>
</html>
