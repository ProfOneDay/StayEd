<div class="st-panel st-panel-pad col-6" data-animate>
  <div class="st-panel-head">
    <div>
      <h3 class="st-panel-title">Learning Level</h3>
      <p class="st-panel-subtitle">
        How filtered learners are spread across ALS levels.
      </p>
    </div>
    <div class="chart-type-toggle" role="group" aria-label="Choose chart type" id="levelChartToggle">
      <button type="button" class="chart-type-btn is-active" data-chart-type="bar">Bar</button>
      <button type="button" class="chart-type-btn" data-chart-type="pie">Donut</button>
    </div>
  </div>
  <!-- Bar view = HTML bars (crisp text, same component as Risk
       Distribution). Donut view = Chart.js donut in its own fixed-size box
       (so the canvas is never stretched) plus an HTML value list. -->
  <div class="st-dist" id="levelDist">
    <div class="st-hbars st-dist-bars" data-dist-bars hidden></div>
    <div class="st-dist-donut" data-dist-donut hidden>
      <div class="st-dist-donut-chart"><canvas id="levelChartCanvas"></canvas></div>
      <ul class="st-dist-list" data-dist-list></ul>
    </div>
  </div>
  <p class="chart-canvas-note" id="levelChartNote"></p>
</div>

<div class="st-panel st-panel-pad col-6" data-animate>

  <!-- Bar view = HTML bars (crisp text, same component as Risk

       (so the canvas is never stretched) plus an HTML value list. -->
  <div class="st-dist" id="modalityDist">
    <div class="st-hbars st-dist-bars" data-dist-bars hidden></div>

</div>
