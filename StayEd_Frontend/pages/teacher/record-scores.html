<!doctype html>
<html lang="en">
  <head>
    <script data-stayed-font-scale-bootstrap>
      (function () {
        try {
          var v = localStorage.getItem("stayed_font_scale");
          if (v) document.documentElement.setAttribute("data-font-scale", v);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayEd | Record Scores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Franklin:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/img/brand/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      href="../../assets/img/brand/apple-touch-icon.png"
    />
  </head>
  <body class="st-app" data-page="Record Scores">
    <div data-component="layout/sidebar"></div>

    <div class="st-main">
      <div data-component="layout/navbar"></div>

      <main class="st-content">
        <div class="st-page-header">
          <div>
            <h1 class="st-page-header-title">Record Scores</h1>
            <p class="st-page-header-subtitle">
              Enter Pre-Test and Post-Test scores for everyone in this
              module at once &mdash; each cell saves as soon as you leave it,
              no per-learner forms.
            </p>
          </div>
          <div class="st-page-header-actions">
            <a href="module-management.html" class="st-btn st-btn-outline" data-back-link>
              <span class="material-symbols-outlined">arrow_back</span>
              Back to Modules
            </a>
          </div>
        </div>

        <div
          class="st-class-context-banner st-hidden"
          data-class-context-banner
        >
          <span class="material-symbols-outlined st-class-context-banner-icon"
            >school</span
          >
          <div class="st-class-context-banner-text">
            <span class="st-class-context-banner-clc" data-class-context-clc
              >—</span
            >
            <span
              class="st-class-context-banner-level"
              data-class-context-level
              >—</span
            >
            <span class="st-class-context-banner-meta" data-class-context-meta
              >—</span
            >
          </div>
        </div>

        <div class="st-panel st-panel-pad" data-no-module-notice style="display:none">
          <p class="st-panel-subtitle">
            Open Record Scores from a specific module in Module Management.
          </p>
        </div>

        <div data-view-root></div>
      </main>

      <div data-component="layout/footer"></div>
    </div>

    <div data-component="layout/toast"></div>
    <div data-component="layout/modal"></div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/core/utils.js"></script>
    <script src="../../assets/js/core/router.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/core/guards.js"></script>
    <script src="../../assets/js/core/layout.js"></script>
    <script src="../../assets/js/core/skeletons.js"></script>
    <script src="../../assets/js/core/app.js"></script>
    <script src="../../assets/js/components/component-loader.js"></script>
    <script src="../../assets/js/components/toast.js"></script>
    <script src="../../assets/js/components/modal.js"></script>
    <script src="../../assets/js/teacher/record-scores.js"></script>
  </body>
</html>
